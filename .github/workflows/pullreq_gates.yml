name: Run all check-in gates on Pull Requests

on: [pull_request]

jobs:
  build:
    name: Run check-in gates
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4.0.3
      with:
        node-version: 22
    - name: Install deps
      run: npm install
    - name: Typescript type check
      run: npm run typeCheck
    - name: Run ESLint
      run: npm run lint
